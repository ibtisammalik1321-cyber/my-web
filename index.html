<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Best Friend ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    color:white;
}

h1{
    font-size:45px;
    animation:fade 2s infinite alternate;
}

p{
    margin-top:20px;
    font-size:22px;
}

.friend{
    width:200px;
    height:200px;
    margin:30px auto;
    border-radius:50%;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:80px;
    animation:bounce 2s infinite;
    box-shadow:0 0 30px white;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    background:#ff4b6e;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

#love{
    margin-top:30px;
    font-size:40px;
    display:none;
    animation:love 1s infinite;
}

.heart{
    position:absolute;
    color:red;
    font-size:25px;
    animation:fall 5s linear infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-30px);
    }
}

@keyframes fade{
    from{
        opacity:.5;
    }
    to{
        opacity:1;
    }
}

@keyframes love{
    50%{
        transform:scale(1.2);
    }
}

@keyframes fall{
    from{
        top:-10%;
    }
    to{
        top:100%;
    }
}

</style>
</head>

<body>

<div class="container">

<h1>✨ My Best Friend ✨</h1>

<div class="friend">
😊
</div>

<p>
Tum meri life ka sab se special dost ho ❤️
<br>
Thank you for always being there!
</p>

<button onclick="showLove()">
Click Here ❤️
</button>

<div id="love">
I Love You Best Friend ❤️
</div>

</div>


<script>

function showLove(){

    document.getElementById("love").style.display="block";

    for(let i=0;i<40;i++){

        let heart=document.createElement("div");

        heart.className="heart";
        heart.innerHTML="❤️";

        heart.style.left=Math.random()*100+"%";
        heart.style.animationDuration=(2+Math.random()*3)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },5000);

    }

}

</script>

</body>
</html>
