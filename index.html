<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise 💗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#fff0f6,#ffe0ec,#f4e7ff);
  color:#642742;
  overflow:hidden;
}

.container{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:650px;
  text-align:center;
  padding:55px 30px;
  border-radius:35px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(15px);
  box-shadow:0 25px 70px rgba(100,40,70,.18);
  animation:show .9s ease;
}

.sparkles{
  font-size:30px;
  margin-bottom:15px;
}

.small{
  font-size:12px;
  letter-spacing:3px;
  text-transform:uppercase;
  opacity:.6;
}

h1{
  font-family:'Pacifico',cursive;
  font-weight:400;
  font-size:clamp(42px,10vw,72px);
  color:#d74778;
  margin:20px 0;
}

p{
  line-height:1.8;
  font-size:16px;
}

button{
  margin-top:30px;
  border:none;
  padding:15px 28px;
  border-radius:50px;
  background:linear-gradient(135deg,#ff6f9d,#c967e8);
  color:white;
  font-family:'Poppins',sans-serif;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 12px 25px rgba(201,103,232,.25);
  transition:.25s;
}

button:hover{
  transform:translateY(-3px) scale(1.03);
}

.heart{
  position:fixed;
  bottom:-30px;
  font-size:22px;
  animation:float 6s linear forwards;
  pointer-events:none;
}

@keyframes float{
  from{
    transform:translateY(0) rotate(0);
    opacity:.8;
  }
  to{
    transform:translateY(-110vh) rotate(30deg);
    opacity:0;
  }
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="sparkles">
      ✨ 💗 ✨
    </div>

    <div class="small">
      A little surprise for you
    </div>

    <h1>Hello, Beautiful Soul 💕</h1>

    <p>
      Some people make ordinary moments feel a little more special.
      So here's a tiny website made with lots of cute vibes,
      smiles and good wishes. 🌸
    </p>

    <button onclick="nextPage()">
      Open the surprise 💌
    </button>

  </div>

</div>

<script>

function createHeart(){

  const heart=document.createElement("div");

  heart.className="heart";

  const emojis=["💗","💕","💖","🌸","✨","♡"];

  heart.innerHTML=
    emojis[Math.floor(Math.random()*emojis.length)];

  heart.style.left=Math.random()*100+"vw";

  heart.style.fontSize=
    (15+Math.random()*20)+"px";

  heart.style.animationDuration=
    (4+Math.random()*4)+"s";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },8000);
}

setInterval(createHeart,600);


function nextPage(){

  document.body.style.opacity="0";

  document.body.style.transition="opacity .4s";

  setTimeout(()=>{
    window.location.href="memories.html";
  },400);

}

</script>

</body>
  </html>
